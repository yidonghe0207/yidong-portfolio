<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="TUNE. A word made of sand, finding its frequency. Click to dissolve into an ever-changing field of resonance.">
<title>TUNE — Sand & Sound</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#888;background:#000;font-synthesis:none;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}button,input{font:inherit}button{color:inherit;cursor:pointer}
#field{position:fixed;inset:0;border:0;background:none;width:100%;height:100%;-webkit-tap-highlight-color:transparent}#field:focus-visible{outline:1px solid #92928a;outline-offset:-18px}
header,footer{position:fixed;left:40px;right:40px;display:flex;align-items:center;justify-content:flex-end;pointer-events:none;z-index:2;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
header{top:33px}footer{bottom:32px}.controls{display:flex;align-items:center;gap:15px;pointer-events:auto}
#sound,#reset{background:none;border:0;padding:10px 0;text-transform:uppercase;font-size:10px;letter-spacing:.13em;pointer-events:auto}
#sound{display:flex;gap:9px;align-items:center}#sound svg{width:15px;height:15px}#volume{accent-color:#85857c;width:58px;height:2px;cursor:pointer}
#error{position:fixed;inset:35%;font-size:15px;line-height:1.6;display:none}button:focus-visible,input:focus-visible{outline:1px solid currentColor;outline-offset:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:600px){header,footer{left:22px;right:22px}header{top:22px}footer{bottom:24px}#volume{width:42px}#reset{font-size:9px}}
</style>
</head>
<body>
<canvas id="canvas" aria-hidden="true"></canvas>
<button id="field" aria-label="Dissolve TUNE into a new sand soundwave"></button>
<header><div class="controls"><button id="sound" aria-label="Mute sound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M11 5 5 9H2v6h3l6 4Z"/><path id="sound-waves" d="M15 8q4 4 0 8M18 4q8 8 0 16"/></svg><span id="sound-label">Sound on</span></button><label class="sr-only" for="volume">Volume</label><input id="volume" type="range" min="0" max="100" value="24" aria-label="Volume"></div></header>
<footer><button id="reset" aria-label="Return sand to the TUNE word">↩ Reset</button></footer>
<p id="announcement" class="sr-only" role="status" aria-live="polite"></p><p id="error"></p>
<script src="app.js"></script>
<script src="../embed.js"></script></body></html>
