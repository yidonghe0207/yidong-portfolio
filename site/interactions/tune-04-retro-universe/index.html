const canvas=document.getElementById('field'),ctx=canvas.getContext('2d',{alpha:false});

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const mix=(a,b,t)=>a+(b-a)*t;

const TILT_C=Math.cos(-.31),TILT_S=Math.sin(-.31);

function armAngle(r,arm){return (arm?3.48:0)+Math.log(.23+r)*2.5+.22*Math.sin(r*14+arm*2);}

 const count=Math.min(stars.length,Math.max(85,Math.round(w*h/4900)));
 ctx.fillStyle='#fff';
 for(let i=0;i<count;i++){const s=stars[i],x=Math.round(s.x*w),y=Math.round(s.y*h);ctx.globalAlpha=s.alpha;
  ctx.fillRect(x,y,s.size,s.size);

}

function addWord(px=w/2,py=h/2){
 if(paused){paused=false;last=0;}
 const first=words===0;
 // Each click contributes the entire original word, including every outline pixel.

addEventListener('keydown',e=>{if(e.code==='Escape')reset();});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{last=0;if(!document.hidden&&words&&!paused)schedule();});
