<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift — into the distance</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white}canvas{display:block;width:100%;height:100%}button{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:1px dashed #999;outline-offset:16px}button[aria-disabled=true]{cursor:default}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<button aria-label="Drift into space. Hover to reveal the stars; click to launch."></button>
<span class="sr" role="status" aria-live="polite">Ready. Hover over drift to reveal the stars.</span>
<script>
(()=>{'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),button=document.querySelector('button'),status=document.querySelector('[role=status]');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const duration=21.5;
let W,H,D,size,state='ready',hover=false,mix=0,elapsed=0,last=0,stars=[],words=[],cooldown=false;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,v)=>{v=clamp((v-a)/(b-a));return v*v*(3-2*v)};
// Hand-built vector outlines following the supplied tall, tightly spaced wordmark.
const outlines=[
 'M18 33 Q1 33 1 52 L1 134 Q1 152 18 152 Q19 152 19 149 L19 36 Q19 33 18 33 Z M26 1 L36 1 Q40 1 40 5 L40 149 Q40 152 37 152 L26 152 Q23 152 23 149 L23 5 Q23 1 26 1 Z',
 'M45 33 L56 33 Q59 33 59 37 L59 149 Q59 152 56 152 L45 152 Q42 152 42 149 L42 37 Q42 33 45 33 Z M63 33 Q81 33 81 49 L81 70 Q81 73 78 73 L66 73 Q63 73 63 70 Z',
 'M86 14 L97 14 Q100 14 100 18 L100 26 Q100 29 97 29 L86 29 Q83 29 83 26 L83 18 Q83 14 86 14 Z M86 33 L97 33 Q100 33 100 37 L100 149 Q100 152 97 152 L86 152 Q83 152 83 149 L83 37 Q83 33 86 33 Z',
 'M103 29 L122 29 Q126 29 126 25 L127 17 Q127 13 123 13 L115 13 Q103 13 103 25 Z M106 33 L123 33 Q126 33 126 36 L126 47 Q126 50 123 50 L119 50 L119 149 Q119 152 116 152 L106 152 Q103 152 103 149 L103 37 Q103 33 106 33 Z',
 'M134 15 L143 15 Q146 15 146 19 L146 33 L150 33 Q154 33 154 36 L154 47 Q154 50 150 50 L130 50 Q128 50 129 46 L130 19 Q130 15 134 15 Z M132 54 L143 54 Q146 54 146 58 L146 132 Q146 136 151 136 Q154 136 154 139 L154 148 Q154 152 144 152 Q129 152 129 137 L129 58 Q129 54 132 54 Z'
];
const paths=outlines.map(d=>new Path2D(d));
// Flatten the quadratic vector contours once; project every vertex in 3D.
const contours=outlines.flatMap(d=>{
 const tokens=d.match(/[MLQZ]|-?\d+(?:\.\d+)?/g),result=[];let i=0,x=0,y=0,contour;
 while(i<tokens.length){const op=tokens[i++];
  if(op==='M'){x=+tokens[i++];y=+tokens[i++];contour=[[x,y]];result.push(contour);}
  else if(op==='L'){x=+tokens[i++];y=+tokens[i++];contour.push([x,y]);}
  else if(op==='Q'){const cx=+tokens[i++],cy=+tokens[i++],ex=+tokens[i++],ey=+tokens[i++];
   for(let j=1;j<=12;j++){const t=j/12,s=1-t;contour.push([s*s*x+2*s*t*cx+t*t*ex,s*s*y+2*s*t*cy+t*t*ey]);}x=ex;y=ey;
  }
 }
 return result;
});
const travel=t=>.024*(Math.expm1(Math.max(0,t)*.49)/.49-Math.max(0,t))+.6*Math.pow(Math.max(0,t-10),4);
const velocity=t=>.024*Math.expm1(t*.49)+2.4*Math.pow(Math.max(0,t-10),3);
function project(x,y,z){const focal=Math.min(W,H)*.85;return {x:W/2+focal*x/z,y:H/2+focal*y/z};}
let seed=8291;function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function makeStar(){const angle=random()*Math.PI*2,r=.35+random()*5;return {x:Math.cos(angle)*r,y:Math.sin(angle)*r,z:.15+random()*18,light:.25+random()*.75,width:.45+random()*1.2,phase:random()*6.28}}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);size=Math.min(238,W*.46,H*.40);button.style.width=size+'px';button.style.height=size+'px';stars=Array.from({length:W<600?1000:1700},()=>makeStar(true));}
function setState(next){state=next;canvas.dataset.state=state;button.setAttribute('aria-disabled',String(state==='flight'));}
function reset(){elapsed=0;mix=0;hover=false;cooldown=true;setState('ready');status.textContent='Flight complete. Hover again to replay.';}
function launch(){if(state==='flight')return;cooldown=false;elapsed=0;words=[];
 // Stationary words along a cylindrical corridor. The camera alone translates.
 for(let i=0;i<120;i++){const angle=i*2.399963,r=1.1+random()*.9;
  words.push({angle,x:Math.cos(angle)*r,y:Math.sin(angle)*r,z:1.8-i*.40,scale:.7+random()*.5});}
 setState('flight');status.textContent='Accelerating into the distance. Press Escape to return.';}
button.addEventListener('pointerenter',()=>{if(!cooldown)hover=true});button.addEventListener('pointerleave',()=>{hover=false;cooldown=false});button.addEventListener('focus',()=>{if(!cooldown)hover=true});button.addEventListener('blur',()=>hover=false);button.addEventListener('click',launch);
addEventListener('keydown',e=>{if(e.key==='Escape')reset()});
document.addEventListener('visibilitychange',()=>last=0);
function flatWord(opacity,tone=255){
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(size/155,size/155);ctx.translate(-77.5,-77);ctx.globalAlpha=opacity;
 ctx.fillStyle=`rgb(${tone},${tone},${tone})`;paths.forEach(p=>ctx.fill(p));ctx.restore();
}
function word3D(x,y,z,width,tilt,opacity,angle=Math.PI/2){
 if(z-width*.5*Math.sin(tilt)<.08||opacity<.003)return;
 const co=Math.cos(angle),si=Math.sin(angle),ct=Math.cos(tilt),st=Math.sin(tilt);
 const center=project(x,y,z),screenWidth=Math.min(W,H)*.85*width/z;
 if(center.x< -screenWidth*2||center.x>W+screenWidth*2||center.y< -screenWidth*2||center.y>H+screenWidth*2||screenWidth<.5)return;
 ctx.save();ctx.globalAlpha=opacity;ctx.fillStyle='white';ctx.beginPath();
 for(const contour of contours){
  contour.forEach(([px,py],i)=>{
   const u=(px-77.5)/155*width,v=(py-77)/155*width;
   // Local right is tangent to the tunnel; local down points outward and nearer.
   const q=project(x+si*u+co*v*ct,y-co*u+si*v*ct,z-v*st);
   if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);
  });ctx.closePath();
 }ctx.fill();
 ctx.restore();
}
function frame(now){
 const dt=last?Math.min((now-last)/1000,.05):0;last=now;
 const flying=state==='flight';if(flying)elapsed+=dt;
 const t=elapsed,p=clamp(t/duration),motion=reduced.matches;
 let target=flying?1:hover&&!cooldown?1:0;
 mix+=(target-mix)*(1-Math.exp(-dt*6));
 // Let the tunnel reach full streaks before beginning the three-second return.
 let end=flying?smooth(18.5,duration,t):0;
 let bg=Math.round(255*(1-mix));ctx.fillStyle=`rgb(${bg},${bg},${bg})`;ctx.fillRect(0,0,W,H);
 // Exponential velocity and its integral: acceleration stays positive to the exit.
 const speed=flying&&!motion?velocity(t):0;
 const distance=flying&&!motion?travel(t):0;
 const previousDistance=flying&&!motion?travel(t-.12):0;
 const exposureDistance=distance-previousDistance;
 const visibility=mix;
 if(visibility>.002){
  ctx.lineCap='round';
  for(const s of stars){
   // Periodic static star volume, viewed by the same retreating camera as the type.
   const cycle=Math.floor((s.z+previousDistance)/18),z=s.z+previousDistance-cycle*18;
   if(z<.10)continue;
   // Integrate a real shutter interval across a stationary point's trajectory.
   // Do not wrap the head: at high speed it must reach all the way to the center.
   const head=project(s.x,s.y,z+exposureDistance),tail=project(s.x,s.y,z);
   const a=visibility*s.light*Math.min(1,4/z)*(.82+.18*Math.sin(now*.0006+s.phase));
   ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.fillStyle=ctx.strokeStyle;
   if(speed>.05){ctx.lineWidth=s.width;ctx.beginPath();ctx.moveTo(head.x,head.y);ctx.lineTo(tail.x,tail.y);ctx.stroke();}
   else{ctx.beginPath();ctx.arc(head.x,head.y,s.width*.7,0,Math.PI*2);ctx.fill();}
  }
 }
 if(flying&&!motion){
  const tilt=smooth(0,3.8,t)*Math.PI*.34,width=size/(Math.min(W,H)*.85);
  word3D(0,0,1+distance,width,tilt,1);
  const blur=smooth(.4,9,exposureDistance);
  for(const w of words){
   // Repeat the corridor in world space, with the same camera and shutter as stars.
   const cycle=Math.floor((w.z+previousDistance)/48);
   if(cycle<0)continue;
   const startZ=w.z+previousDistance-cycle*48,z=startZ+exposureDistance;
   const fade=smooth(1,2.5,t)*smooth(.15,.6,startZ)*(1-smooth(32,48,startZ));
   if(blur<.995)word3D(w.x,w.y,z,width*w.scale,Math.PI/2,fade*.82*(1-blur),w.angle);
   if(blur>.001&&fade>.003){
    // Each glyph leaves a narrowing track along its projected world trajectory.
    ctx.strokeStyle=`rgba(255,255,255,${fade*blur*.32})`;
    ctx.lineWidth=.65;ctx.beginPath();
    for(const px of [12,32,51,91,112,140]){
     const u=(px-77.5)/155*width*w.scale;
     const x=w.x+Math.sin(w.angle)*u,y=w.y-Math.cos(w.angle)*u;
     const tail=project(x,y,Math.max(.15,startZ)),head=project(x,y,z);
     ctx.moveTo(tail.x,tail.y);ctx.lineTo(head.x,head.y);
    }ctx.stroke();
   }
  }
 }else if(flying){flatWord(1-smooth(0,2,t));if(t>3)end=smooth(3,4,t);}
 else flatWord(1,Math.round(255*mix));
 if(end>0){ctx.fillStyle=`rgba(255,255,255,${end})`;ctx.fillRect(0,0,W,H);}
 if(flying&&!motion&&t>19.5)flatWord(smooth(19.5,duration,t),0);
 if(flying&&t>=(motion?4:duration))reset();
 requestAnimationFrame(frame);
}
window.driftUniverse={get state(){return state},get elapsed(){return elapsed},get speed(){return velocity(elapsed)},duration,project,travel,velocity};
addEventListener('resize',resize);resize();setState('ready');requestAnimationFrame(frame);
})();
</script>
<script src="../embed.js"></script></body></html>
