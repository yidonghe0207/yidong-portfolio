<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>TUNE — Equalizer Type</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
:root{color-scheme:dark;--bg:#090909;--ink:#f5f5f0;--muted:#aaa;--line:#363636;--panel:#090909f2;--halo:#fff2}
:root[data-theme=light]{color-scheme:light;--bg:#fff;--ink:#101010;--muted:#777;--line:#ddd;--panel:#fffffff2;--halo:#1111}
body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default;outline:none}
canvas:focus-visible{outline:1px solid var(--ink);outline-offset:-10px}
.controls{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:9px 12px;border:1px solid var(--line);border-radius:50px;background:var(--panel)}
button,input{-webkit-tap-highlight-color:transparent}
button{border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;padding:10px;border-radius:50%}
button:hover{background:var(--halo)}button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
svg{width:16px;height:16px;fill:currentColor}#mic[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#mic[data-state=requesting]{outline:1px dashed var(--muted);outline-offset:-3px}
.separator{width:1px;height:18px;background:var(--line)}
.energy{display:flex;align-items:center;gap:10px;color:var(--muted)}.energy svg{width:14px;height:14px}
input[type=range]{height:3px;width:80px;accent-color:var(--ink);cursor:pointer;margin:0}
.swatch{width:16px;height:16px;border:1.5px solid currentColor;border-radius:50%;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hint{position:absolute;bottom:126px;left:24px;right:24px;text-align:center;font-size:12px;color:var(--muted);line-height:1.5;max-width:580px;margin:auto;pointer-events:none}
[hidden]{display:none!important}
@media(max-width:600px){.controls{bottom:40px;gap:9px;padding:8px 10px}input[type=range]{width:65px}.energy{gap:8px}.hint{bottom:112px;font-size:11px}}
@media(max-width:360px){.controls{gap:6px}input[type=range]{width:55px}}
</style>  <meta property="og:title" content="Figma Make App">
</head><body>
<canvas id="stage" tabindex="0" role="button" aria-pressed="false" aria-label="TUNE. Click or press Enter to use your microphone. Press Space to pause."></canvas>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<div class="hint" id="hint" role="status" aria-live="polite" hidden></div>
<div class="controls" role="group" aria-label="Animation controls">
<button id="play" aria-label="Pause animation" title="Pause animation" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zm5 0h3v10H9z"/></svg><span class="sr-only">Pause</span></button>
<div class="separator" aria-hidden="true"></div>
<label class="energy" for="energy"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 11h2v4H1zm4-4h2v8H5zm4-3h2v11H9zm4-3h2v14h-2z"/></svg><span id="energy-label" class="sr-only">Energy</span><input id="energy" type="range" min="0" max="100" value="55" title="Energy"></label>
<div class="separator" aria-hidden="true"></div>
<button id="mic" aria-pressed="false" aria-label="Use microphone" title="Use microphone"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a3 3 0 0 0-3 3v4a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3ZM3 7H2v1a6 6 0 0 0 5 5.92V15h2v-1.08A6 6 0 0 0 14 8V7h-1v1A5 5 0 0 1 3 8Z"/></svg><span class="sr-only">Use mic</span></button>
<button id="theme" aria-label="Switch to white background" title="Switch to white background" aria-pressed="true"><i class="swatch" aria-hidden="true"></i><span class="theme-label sr-only">White</span></button>
</div>
<script>
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
const mask=document.createElement('canvas');mask.width=980;mask.height=370;
const m=mask.getContext('2d',{willReadFrequently:true});
const glyphs=[
'M0 18H224V114H154V342H70V114H0Z',
'M238 18H322V228Q322 264 350 264Q378 264 378 228V18H462V234Q462 342 350 342Q238 342 238 234Z',
'M476 342V18H560L630 192V18H714V342H630L560 168V342Z',
'M728 18H966V114H812V138H938V216H812V252H966V342H728Z'
];
m.fillStyle='#000';glyphs.forEach(p=>m.fill(new Path2D(p),'evenodd'));
const pixels=m.getImageData(0,0,980,370).data;
const CW=14,CH=6,COLS=70,ROWS=62,columns=[];
for(let c=0;c<COLS;c++){const rows=[];for(let r=0;r<ROWS;r++){const x=c*CW+7,y=r*CH+3;if(y<370&&pixels[(y*980+x)*4+3]>128)rows.push(r);}columns.push(rows);}


// Cells never translate: only their lit state changes near the upper edge.
const topRuns=columns.map(rows=>{let n=0;while(n<rows.length&&rows[n]===rows[0]+n)n++;return n;});
const phases=columns.map((_,c)=>{const n=Math.sin(c*127.1+31.7)*43758.5453;return (n-Math.floor(n))*Math.PI*2;});
let width=0,height=0,scale=1,ox=0,oy=0,time=0,last=0,energy=.55,hover=0,pointer=-1000;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let playing=!reduced.matches,dirty=true;

const palettes={light:{ink:'#101010',grid:'#ededeb',off:'#d0d0ca'},dark:{ink:'#f5f5f0',grid:'#202020',off:'#444440'}};
let theme='dark';
function applyTheme(){
 document.documentElement.dataset.theme=theme;
 document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#090909':'#ffffff';
 document.querySelector('#theme .theme-label').textContent=theme==='dark'?'White':'Black';
 document.getElementById('theme').setAttribute('aria-pressed',String(theme==='dark'));
 document.getElementById('theme').setAttribute('aria-label','Switch to '+(theme==='dark'?'white':'black')+' background');
 document.getElementById('theme').title=document.getElementById('theme').getAttribute('aria-label');
 dirty=true;
}
document.getElementById('theme').addEventListener('click',()=>{theme=theme==='light'?'dark':'light';applyTheme();});
applyTheme();

let micState='idle',micError='',micGeneration=0,stream=null,audioContext=null,source=null,analyser=null,frequencies=null,waveform=null;
const levels=new Float32Array(COLS);
let volume=0;
const micButton=document.getElementById('mic'),hint=document.getElementById('hint');
function resize(){width=innerWidth;height=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min((width-(width<600?42:110))/980,1.22,(height-240)/430);scale=Math.max(.15,scale);ox=(width-980*scale)/2;oy=(height-370*scale)/2-25;dirty=true;}
function cell(c,r){ctx.fillRect(ox+c*CW*scale,oy+r*CH*scale,11.7*scale,4.25*scale);}
function topDepth(c){return Math.max(0,Math.min(24,topRuns[c]-3,30-(columns[c][0]??30)));}
function topDrop(c){
 const depth=topDepth(c),phase=phases[c];
 if(micState==='live')return Math.round(depth*(1-levels[c]));
 const pulse=Math.pow(Math.max(0,.5+.34*Math.sin(time*(1.5+.25*Math.sin(phase))+phase)+.16*Math.sin(time*3.4+phase*2.3)),.8);
 const near=Math.exp(-Math.pow((c-pointer)/4,2))*hover;
 return Math.min(depth,Math.max(0,Math.round(pulse*(6+energy*13)-near*5)));
}
function readAudio(dt){
 if(micState!=='live'||!analyser)return;
 analyser.getByteFrequencyData(frequencies);
 analyser.getFloatTimeDomainData(waveform);
 let sum=0;for(const sample of waveform)sum+=sample*sample;
 volume=Math.sqrt(sum/waveform.length);
 const decibels=20*Math.log10(Math.max(volume,.000001));
 const loudness=volume<.0015?0:Math.min(1,Math.max(0,(decibels+62+energy*12)/44));
 const binHz=audioContext.sampleRate/analyser.fftSize;
 for(let c=0;c<COLS;c++){
  const low=80*Math.pow(6000/80,c/COLS),high=80*Math.pow(6000/80,(c+1)/COLS);
  const first=Math.max(1,Math.floor(low/binHz)),end=Math.min(frequencies.length-1,Math.max(first+1,Math.ceil(high/binHz)));
  let peak=0;for(let b=first;b<=end;b++)peak=Math.max(peak,frequencies[b]/255);
  const target=Math.min(1,loudness*(.62+peak*.65));
  const rate=target>levels[c]?42:9;
  levels[c]+=(target-levels[c])*(1-Math.exp(-dt*rate));
 }
}
function draw(){
 const palette=palettes[theme];ctx.clearRect(0,0,width,height);ctx.fillStyle=palette.grid;
 for(let c=0;c<COLS;c++)for(let r=3;r<=57;r++)cell(c,r);
 for(let c=0;c<COLS;c++){
  const rows=columns[c],drop=topDrop(c);
  for(let i=0;i<rows.length;i++){ctx.fillStyle=i<drop?palette.off:palette.ink;cell(c,rows[i]);}
 }
}
function tick(now){const dt=Math.min((now-last)/1000||0,.05);last=now;if(playing){time+=dt;readAudio(dt);}if(playing||dirty){draw();dirty=false;}requestAnimationFrame(tick);}
function updateUI(){
 document.querySelector('#play span').textContent=playing?'Pause':'Play';
 document.getElementById('play').setAttribute('aria-label',playing?'Pause animation and stop microphone':'Play animation');
 document.getElementById('play').setAttribute('aria-pressed',String(!playing));
 document.querySelector('#play path').setAttribute('d',playing?'M4 3h3v10H4zm5 0h3v10H9z':'M4 2l10 6-10 6z');
 document.getElementById('status').textContent=micState==='requesting'?'Allow microphone':micState==='live'?'Listening':playing?'Idle':'Paused';
 document.querySelector('#mic span').textContent=micState==='requesting'?'Cancel':micState==='live'?'Stop mic':'Use mic';
 micButton.setAttribute('aria-pressed',String(micState==='live'));
 canvas.setAttribute('aria-pressed',String(micState==='live'));
 canvas.setAttribute('aria-label',micState==='live'?'TUNE. Microphone active. Click or press Enter to stop listening.':'TUNE. Click or press Enter to enable your microphone and animate the word with your voice.');
 document.querySelector('#energy-label').textContent=micState==='live'?'Sensitivity':'Energy';
 micButton.dataset.state=micState;
 micButton.setAttribute('aria-label',micState==='requesting'?'Cancel microphone request':micState==='live'?'Stop microphone':'Use microphone');
 micButton.title=micButton.getAttribute('aria-label');
 document.getElementById('play').title=document.getElementById('play').getAttribute('aria-label');
 document.getElementById('energy').title=micState==='live'?'Sensitivity':'Energy';
 hint.textContent=micError;
 hint.hidden=!micError;
 dirty=true;
}
function stopMic(message=''){
 ++micGeneration;
 // Stop hardware first, including on pause, navigation and tab hide.
 if(stream)for(const track of stream.getTracks())track.stop();
 stream=null;
 if(source){try{source.disconnect();}catch{}}source=null;
 const oldContext=audioContext;audioContext=null;analyser=null;
 if(oldContext&&oldContext.state!=='closed')oldContext.close().catch(()=>{});
 frequencies=null;waveform=null;levels.fill(0);volume=0;
 micState='idle';micError=message;updateUI();
}
async function startMic(){
 if(micState!=='idle')return;
 if(!navigator.mediaDevices?.getUserMedia||!(window.AudioContext||window.webkitAudioContext)){
  micError='Microphone unavailable here. Open this page in your browser to try again.';updateUI();return;
 }
 const generation=++micGeneration;
 micState='requesting';micError='';updateUI();
 let requestedStream=null,localContext=null;
 try{
  // Resume from the user's gesture so mobile browsers can start audio analysis.
  localContext=new (window.AudioContext||window.webkitAudioContext)();
  audioContext=localContext;
  const resumed=localContext.resume().then(()=>null,error=>error);
  requestedStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false},video:false});
  if(generation!==micGeneration){requestedStream.getTracks().forEach(t=>t.stop());return;}
  stream=requestedStream;
  const resumeError=await resumed;if(resumeError)throw resumeError;
  if(generation!==micGeneration)return;
  source=localContext.createMediaStreamSource(stream);
  analyser=localContext.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=.35;analyser.minDecibels=-85;analyser.maxDecibels=-20;
  frequencies=new Uint8Array(analyser.frequencyBinCount);waveform=new Float32Array(analyser.fftSize);
  source.connect(analyser); // Never connect microphone audio to speakers.
  for(const track of stream.getTracks())track.addEventListener('ended',()=>{if(generation===micGeneration)stopMic('Microphone disconnected. Click TUNE to reconnect.');},{once:true});
  micState='live';playing=true;hover=0;updateUI();
 }catch(error){
  if(requestedStream)requestedStream.getTracks().forEach(t=>t.stop());
  if(generation!==micGeneration)return;
  const denied=error.name==='NotAllowedError'||error.name==='SecurityError';
  stopMic(denied?'Microphone blocked. Allow access in your browser settings, then click TUNE.':error.name==='NotFoundError'?'No microphone found. Connect one, then click TUNE.':error.name==='NotReadableError'?'Microphone unavailable. Check that another app is not using it, then retry.':'Could not start microphone. Click TUNE to try again.');
 }finally{
  if(generation!==micGeneration&&localContext&&localContext.state!=='closed')localContext.close().catch(()=>{});
 }
}
function toggleMic(){if(micState==='idle')startMic();else stopMic();}
function togglePlay(){if(playing){playing=false;if(micState!=='idle')stopMic();}else playing=true;updateUI();}
document.getElementById('play').addEventListener('click',togglePlay);
micButton.addEventListener('click',toggleMic);
document.getElementById('energy').addEventListener('input',e=>{energy=e.target.value/100;dirty=true;});
function insideWord(e){const x=(e.clientX-ox)/scale,y=(e.clientY-oy)/scale;return x>=0&&x<980&&y>=18&&y<=348;}
canvas.addEventListener('pointermove',e=>{canvas.style.cursor=insideWord(e)?'pointer':'default';if(!playing||micState==='live')return;pointer=(e.clientX-ox)/scale/CW;hover=Math.max(0,1-Math.abs((e.clientY-oy)/scale-190)/260);dirty=true;});
function clearPointer(){if(!playing)return;hover=0;dirty=true;}
canvas.addEventListener('pointerleave',clearPointer);
let press=null;
canvas.addEventListener('pointerdown',e=>{press={x:e.clientX,y:e.clientY,inside:insideWord(e)};});
canvas.addEventListener('pointerup',e=>{if(press?.inside&&insideWord(e)&&Math.hypot(e.clientX-press.x,e.clientY-press.y)<12)toggleMic();press=null;if(e.pointerType==='touch')clearPointer();});
canvas.addEventListener('pointercancel',()=>{press=null;clearPointer();});
canvas.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Enter'){e.preventDefault();toggleMic();}if(e.code==='Space'){e.preventDefault();togglePlay();}});
reduced.addEventListener('change',()=>{if(reduced.matches){playing=false;stopMic();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&micState!=='idle')stopMic();});
addEventListener('pagehide',()=>stopMic());
addEventListener('resize',resize);resize();updateUI();requestAnimationFrame(tick);
</script><script src="../embed.js"></script></body></html>
