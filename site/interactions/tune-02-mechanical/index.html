<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>TUNE — Cosmology in motion</title>
<meta name="description" content="An interactive mechanical word. Let Cosmology's circular joints loosen, then turn each screw to bring TUNE back into alignment.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#232323;font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit}button:focus-visible{outline:1px solid #555;outline-offset:5px}header,footer{position:fixed;left:34px;right:34px;display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none;font-size:10px;letter-spacing:.13em;text-transform:uppercase}header{top:28px;justify-content:flex-end}footer{bottom:28px;color:#777}.identity{display:flex;gap:17px;align-items:center}.identity strong{font-weight:500;color:#222;letter-spacing:.18em}.identity span{color:#888;border-left:1px solid #ddd;padding-left:17px}.controls{display:flex;gap:22px;pointer-events:auto}button.control{padding:9px 0;border:0;background:transparent;cursor:pointer;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#777}.control:hover{color:#111}.control svg{vertical-align:-2px;margin-right:5px}.readout{display:flex;align-items:center;gap:11px}#light{width:4px;height:4px;border-radius:50%;background:#999}#light.tuned{background:#242424}#count{font-variant-numeric:tabular-nums;color:#333}#instruction{position:fixed;bottom:80px;left:20px;right:20px;text-align:center;margin:0;color:#777;font-size:12px;letter-spacing:.025em;pointer-events:none;line-height:1.8}#stage{position:absolute;inset:0;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}.joint{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border:0;border-radius:50%;background:transparent;padding:0;outline:none;touch-action:none;color:transparent}.joint:focus-visible{outline:1px dashed #888;outline-offset:6px}#cursor{position:fixed;top:0;left:0;width:48px;height:48px;z-index:10;pointer-events:none;display:none;transform-origin:2px 46px}#cursor svg{width:100%;height:100%;filter:drop-shadow(0 1px 1px #fff)}body.tool #stage,body.tool .joint{cursor:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#status{min-width:103px}.hint-key{letter-spacing:0;text-transform:none;color:#999}@media(max-width:600px){header,footer{left:20px;right:20px}header{top:18px}.identity span{display:none}.controls{gap:12px}.control{font-size:9px!important}footer{bottom:22px}.hint-key{display:none}#instruction{font-size:11px;bottom:76px}.joint{width:32px;height:32px;margin:-16px 0 0 -16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="stage" aria-label="Interactive TUNE lettering"><canvas id="art" aria-hidden="true"></canvas></div>
<header><div class="controls"><button class="control" id="sound" aria-pressed="false">Sound off</button><button class="control" id="pause" aria-pressed="false">Pause</button><button class="control" id="reset" title="Restore all four letters and keep them aligned">Reset</button><button class="control" id="replay" title="Replay (R)">↻ Replay</button></div></header>
<div id="cursor" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="m3 44 4-8 14-14 5 5-14 14-8 4Z" fill="#e8e8e8" stroke="#222" stroke-width="1.3"/><path d="m20 19 14-14q3-3 6 0l3 3q3 3 0 6L29 28q-2 2-4 0l-5-5q-2-2 0-4Z" fill="#272727" stroke="white" stroke-width="1.3"/><path d="m26 19 11-11m-8 14 11-11" stroke="#aaa" stroke-width="1.2"/><path d="m3 44 4-4" stroke="#222"/></svg></div>
<p id="announcement" class="sr-only" aria-live="polite"></p>
<script src="geometry.js"></script><script src="mechanism.js"></script>
<script src="../embed.js"></script></body></html>
